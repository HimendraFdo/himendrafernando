name: Deploy API

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag to build and deploy"
        required: true
        default: "manual"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.API_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}

jobs:
  deploy:
    name: Build and deploy API image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Himendra.Portfolio.sln

      - name: Build
        run: dotnet build Himendra.Portfolio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Himendra.Portfolio.sln --configuration Release --no-build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build -f api/Himendra.Portfolio.Api/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
